# Delete a pull request's head branch once it merges.
#
# GitHub has a native setting for this, `delete_branch_on_merge`, and for the plain case it is
# the better answer: no workflow to maintain, no token, no runner minutes. This exists for the
# one thing the setting cannot express, which is an exception. A pull request labelled
# `keep-branch` keeps its branch, and the setting has no such notion.
#
# If you never need that exception, delete this file and turn the setting on instead:
#   gh api -X PATCH repos/:owner/:repo -F delete_branch_on_merge=true
name: Delete merged branch

on:
  pull_request:
    types: [closed]

# Deleting a ref is a write to the repository's contents. Nothing else here needs a scope.
permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    # A closed-but-unmerged pull request keeps its branch, since the work is still somewhere.
    # A fork's head is not ours to delete and the call would fail rather than no-op.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          note() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          case ",$LABELS," in
            *,keep-branch,*)
              note "Kept \`$BRANCH\`: #$PR is labelled keep-branch."
              exit 0
              ;;
          esac

          # A merged pull request should never have the default branch as its head, but the
          # cost of being wrong here is the repository's trunk, so check rather than trust.
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            note "Refused to delete \`$BRANCH\`: it is the default branch."
            exit 1
          fi

          # 422 means the ref is already gone, which happens when someone deletes it by hand
          # or the native setting is also on. That is the desired end state, not a failure.
          status=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" \
            --silent --include 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}') || status=""

          case "$status" in
            204) note "Deleted \`$BRANCH\` after #$PR merged." ;;
            422|404) note "Nothing to do: \`$BRANCH\` was already gone." ;;
            *) note "Could not delete \`$BRANCH\` (HTTP ${status:-unknown})."; exit 1 ;;
          esac
